name: Offline checks
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: pip install -r dev/requirements-offline.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -X utf8 dev/tools/check_offline.py --profile python --out data/ci-python
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-browser-evidence
          path: data/ci-python
  android-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: pip install -r dev/requirements-offline.txt
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: python -X utf8 dev/tools/check_offline.py --profile android --android-serial emulator-5554 --out data/ci-android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-evidence
          path: data/ci-android
