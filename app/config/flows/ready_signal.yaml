name: ready_signal
title: 就绪提示（声光，待板卡接口）
description: 绿灯 + 蜂鸣 + 播报；板卡端加 /api/led、/api/buzzer、播报后可用
steps:
  - step: led
    with: {color: green}
  - step: buzzer
    with: {ms: 200}
  - step: say
    with: {text: 准备就绪}
