<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>机械臂垃圾分拣 · 作业台</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>机械臂垃圾分拣</h1>
  <nav id="tabs"></nav>
  <div class="chips">
    <span class="chip" id="chipConn">连接中</span>
    <span class="chip" id="chipArm">控制台 —</span>
    <span class="chip" id="chipTask">空闲</span>
    <span class="chip" id="chipMode">模式 —</span>
    <span class="chip" id="chipLatency">距上次事件 —</span>
    <span class="chip warn" id="chipDebug" hidden>调试</span>
    <button class="chip" id="gear" title="扩展与调试">⚙</button>
    <button class="danger stop-all" id="globalStop" title="停止正在跑的流程并停下机械臂">■ 停止</button>
  </div>
</header>

<div id="alarmBanner" class="banner bad" role="alert" hidden></div>
<div id="timerBanner" class="banner warn" hidden></div>

<main id="views"></main>

<footer>
  运行数据来自本机日志，时间均为相对值；运动指令由控制台校验后执行，回读来自设备。仿真画面只说明几何与接口，不代表实机。
</footer>

<script type="module" src="/js/app.js"></script>
</body>
</html>
